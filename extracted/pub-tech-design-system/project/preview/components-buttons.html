<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary (purple), Secondary (aqua), Pop (lime), Ghost · inferred" viewport="700x220" -->
<html lang="de"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
.btn{
  font-family:var(--pub-font-display);font-weight:700;font-size:16px;
  border:0;padding:14px 22px;border-radius:999px;cursor:pointer;
  transition:transform .12s ease,background .12s ease;
}
.btn--sm{padding:8px 16px;font-size:14px}
.btn:active{transform:scale(.98)}
.btn--primary{background:var(--pub-purple-500);color:#fff}
.btn--primary:hover{background:var(--pub-purple-600)}
.btn--secondary{background:var(--pub-aqua-500);color:var(--pub-purple-900)}
.btn--secondary:hover{background:var(--pub-aqua-600)}
.btn--lime{background:var(--pub-lime-500);color:var(--pub-purple-900)}
.btn--lime:hover{background:var(--pub-lime-600)}
.btn--ghost{background:transparent;color:var(--pub-coal-900);border:1.5px solid var(--pub-coal-900)}
.btn--ghost:hover{background:var(--pub-coal-900);color:#fff}
</style>
</head><body>

<div class="col" style="gap:18px">
  <div class="row" style="gap:12px;flex-wrap:wrap">
    <button class="btn btn--primary">Mehr erfahren</button>
    <button class="btn btn--secondary">Kontakt</button>
    <button class="btn btn--lime">Stelle ansehen</button>
    <button class="btn btn--ghost">Abbrechen</button>
  </div>
  <div class="row" style="gap:12px;flex-wrap:wrap">
    <button class="btn btn--primary btn--sm">Klein</button>
    <button class="btn btn--secondary btn--sm">Klein</button>
    <button class="btn btn--lime btn--sm">Klein</button>
    <button class="btn btn--ghost btn--sm">Klein</button>
  </div>
</div>

</body></html>
