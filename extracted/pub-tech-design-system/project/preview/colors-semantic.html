<!doctype html>
<!-- @dsCard group="Colors" name="Semantic colors" subtitle="Bg / fg / accent / border tokens" viewport="700x300" -->
<html lang="de"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style></style>
</head><body>

<div class="grid" style="grid-template-columns:repeat(3,1fr);gap:12px">
  
    <div style="background:#fff;border:1px solid var(--pub-border);border-radius:8px;padding:14px;color:var(--pub-coal-900);min-height:78px;display:flex;flex-direction:column;justify-content:space-between">
      <div style="font-weight:700;font-family:var(--pub-font-display)">Bg · default</div>
      <div class="mono" style="color:var(--pub-coal-900);opacity:.75;font-size:11px">--pub-bg</div>
    </div>
  
    <div style="background:#F8F7F4;border:1px solid var(--pub-border);border-radius:8px;padding:14px;color:var(--pub-coal-900);min-height:78px;display:flex;flex-direction:column;justify-content:space-between">
      <div style="font-weight:700;font-family:var(--pub-font-display)">Bg · paper</div>
      <div class="mono" style="color:var(--pub-coal-900);opacity:.75;font-size:11px">--pub-bg-subtle</div>
    </div>
  
    <div style="background:#24053A;border:1px solid var(--pub-border);border-radius:8px;padding:14px;color:#fff;min-height:78px;display:flex;flex-direction:column;justify-content:space-between">
      <div style="font-weight:700;font-family:var(--pub-font-display)">Bg · dark stage</div>
      <div class="mono" style="color:#fff;opacity:.75;font-size:11px">--pub-bg-inverse</div>
    </div>
  
    <div style="background:#151716;border:1px solid var(--pub-border);border-radius:8px;padding:14px;color:#fff;min-height:78px;display:flex;flex-direction:column;justify-content:space-between">
      <div style="font-weight:700;font-family:var(--pub-font-display)">Fg · text</div>
      <div class="mono" style="color:#fff;opacity:.75;font-size:11px">--pub-fg</div>
    </div>
  
    <div style="background:#6B6D6B;border:1px solid var(--pub-border);border-radius:8px;padding:14px;color:#fff;min-height:78px;display:flex;flex-direction:column;justify-content:space-between">
      <div style="font-weight:700;font-family:var(--pub-font-display)">Fg · muted</div>

    </div>

    </div>
  
    <div style="background:#4A0A77;border:1px solid var(--pub-border);border-radius:8px;padding:14px;color:#fff;min-height:78px;display:flex;flex-direction:column;justify-content:space-between">
      <div style="font-weight:700;font-family:var(--pub-font-display)">Primary</div>
      <div class="mono" style="color:#fff;opacity:.75;font-size:11px">--pub-accent-primary</div>
    </div>
  
    <div style="background:#B5FD42;border:1px solid var(--pub-border);border-radius:8px;padding:14px;color:var(--pub-coal-900);min-height:78px;display:flex;flex-direction:column;justify-content:space-between">

    </div>
  
</div>

</body></html>
